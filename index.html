<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NORDWAY Tools</title>
<meta name="description" content="NORDWAY digital tools: five browser tools and the brand library." />
<link rel="icon" href="ui/favicon.png" />
<link rel="stylesheet" href="ui/site.css" />
<!-- Index v2 : moins de texte, mêmes idées — wordmark, sceau interactif + fiche, liste, formats à l'échelle, bandeau coordonnées -->
<style>
  .hero { padding-block: 32px 0; }
  .hero .word { width: 100%; }
  .hero .line { max-width: none; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 12px 0 0; }

  /* ── le sceau et la fiche, côte à côte ── */
  .index { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; align-items: center; padding-block: 40px 72px; }
  @media (max-width: 1000px) { .index { grid-template-columns: minmax(0, 1fr); gap: 24px; } }
  #seal { display: block; width: 100%; height: auto; max-height: 72vh; overflow: visible; }
  #seal .geo { fill: none; stroke: var(--ink); stroke-width: 1.4; }
  #seal .geo-fill { fill: var(--ink); }
  #seal .laser { stroke: var(--signal); stroke-width: 4; stroke-dasharray: 1; }
  #seal .laser.draw { animation: laser 0.28s linear; }
  @keyframes laser { from { stroke-dashoffset: 1; } }
  #seal .center { fill: var(--signal); stroke: var(--ink); stroke-width: 1.2; }
  #seal .node { cursor: pointer; outline: none; }
  #seal .hit { fill: transparent; }
  #seal .pin { fill: var(--paper); stroke: var(--ink); stroke-width: 1.4; }
  #seal .no { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; fill: var(--mute); }
  #seal .nm { font-family: var(--display); font-size: 24px; letter-spacing: -0.03em; fill: var(--ink); text-transform: uppercase; }
  #seal .node.on .pin { fill: var(--signal); }
  #seal .node.on .no { fill: var(--ink); }
  #seal .node.on .nm { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
  #seal .node:focus-visible .pin { stroke: var(--signal); stroke-width: 3; }
  @media (max-width: 560px) { #seal .nm { display: none; } #seal .no { font-size: 30px; transform: translateY(34px); } }

  .fiche { border-top: 2px solid var(--line); padding-top: 12px; }
  .fiche .f-top { display: flex; justify-content: space-between; }
  .fiche h2 { margin: 10px 0 20px; font-size: clamp(48px, 6vw, 92px); }
  .fiche .f-body { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1fr); gap: 20px; }
  @media (max-width: 560px) { .fiche .f-body { grid-template-columns: minmax(0, 1fr); } }
  .fiche .shot { aspect-ratio: 4 / 5; background: var(--panel); overflow: hidden; }
  .fiche .shot img { width: 100%; height: 100%; object-fit: cover; }
  .fiche .f-text { display: flex; flex-direction: column; }
  .fiche .desc { font-size: 18px; line-height: 1.25; margin-bottom: 18px; }
  .spec { margin: 0 0 20px; border-top: 2px solid var(--line); }
  .spec > div { display: grid; grid-template-columns: 38% minmax(0, 1fr); padding: 9px 0; border-bottom: 1px solid var(--hair); font-family: var(--mono); font-size: 12.5px; }
  .spec dt { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); }
  .spec dd { margin: 0; }
  .fiche .cta { margin-top: auto; }
  .fiche.swap .f-body, .fiche.swap h2 { animation: swap 0.22s linear; }
  @keyframes swap { from { opacity: 0.2; } }

  /* ── la liste : numéro, nom, sortie, vignette ── */
  .list { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--line); }
  .list a {
    display: grid;
    grid-template-columns: 56px minmax(0, 1fr) auto 44px 20px;
    gap: 20px;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--hair);
    text-decoration: none;
    transition: background-color 0.12s, padding 0.12s;
  }
  .list a:hover, .list a.on { background: var(--white); padding-inline: 12px; }
  .list .n { font-family: var(--mono); font-size: 13px; }
  .list .name { font-size: clamp(26px, 2.6vw, 36px); line-height: 1; letter-spacing: -0.03em; text-transform: uppercase; }
  .list .thumb { width: 44px; aspect-ratio: 4 / 5; object-fit: cover; background: var(--panel); }
  @media (max-width: 640px) { .list a { grid-template-columns: 36px minmax(0, 1fr) 40px; } .list .out, .list .go { display: none; } .list .thumb { width: 40px; } }

  /* ── les formats d'export, à l'échelle (1080 px = 64 px) ── */
  .formats { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; padding-block: 56px 0; }
  .formats figure { margin: 0; width: calc(var(--w) * 64px / 1080); }
  .formats .box { border: 2px solid var(--line); background: var(--white); }
  .formats figcaption { padding-top: 6px; white-space: nowrap; }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <span class="label ink">Digital tools</span>
    <span class="mark seal" aria-hidden="true"></span>
    <a class="end label ink" href="brand-assets/">Brand assets →</a>
  </div>
</header>

<main>
  <div class="wrap hero">
    <h1 style="margin:0"><span class="mark word" role="img" aria-label="NORDWAY®"></span></h1>
    <p class="line label ink"><span>Social images, in the browser</span><span>05 tools + library · PNG · MP4 · v1.0</span></p>
  </div>

  <!-- le sceau comme navigation : six points, six outils -->
  <div class="wrap index">
    <svg id="seal" viewBox="-330 -300 660 600" role="group" aria-label="Tools on the NORDWAY seal"></svg>
    <article class="fiche" id="fiche" aria-live="polite">
      <div class="f-top label"><span id="fKind"></span><span id="fNum"></span></div>
      <h2 class="xxl" id="fName"></h2>
      <div class="f-body">
        <div class="shot"><img id="fImg" src="apercu/image-matrice.jpg" alt="Image matrice, example output" /></div>
        <div class="f-text">
          <p class="desc" id="fDesc"></p>
          <dl class="spec" id="fSpec"></dl>
          <a class="cta" id="fGo"><span class="lead"><span class="dot"></span><span>Open</span></span><span>→</span></a>
        </div>
      </div>
    </article>
  </div>

  <div class="wrap">
    <ol class="list" id="list"></ol>
    <div class="formats" aria-label="Export formats">
      <figure style="--w:1080"><div class="box" style="aspect-ratio:4/5"></div><figcaption class="label ink">4:5 feed</figcaption></figure>
      <figure style="--w:1080"><div class="box" style="aspect-ratio:9/16"></div><figcaption class="label ink">9:16 story</figcaption></figure>
      <figure style="--w:1080"><div class="box" style="aspect-ratio:1"></div><figcaption class="label ink">1:1</figcaption></figure>
      <figure style="--w:1240"><div class="box" style="aspect-ratio:210/297"></div><figcaption class="label ink">A4</figcaption></figure>
    </div>
  </div>
</main>

<footer class="site">
  <div class="coord"><span class="mark word" aria-label="NORDWAY"></span><span>Aiguille Dibona</span><span>44°57′45″ N, 6°14′34″ E</span></div>
  <div class="wrap fine label"><span>NORDWAY® · fictional brand</span><span>[For experimental purposes only]</span></div>
</footer>

<script>
// Un outil de plus : une entrée dans TOOLS (dossier, nom, aperçu 4:5 dans apercu/<dossier>.jpg).
// Le sceau a six points ; au-delà, la liste reste la référence.
const TOOLS = [
  { dossier: "image-matrice", nom: "Image matrice", kind: "Viewer", desc: "The brand images as a 2D index, a sphere, a roll, a space or the Mont Blanc.", out: "Live view", fmt: "Full screen" },
  { dossier: "cairn-generator", nom: "Cairn generator", kind: "Loop", desc: "A pile of stones turning in a perfect loop, under a type layer.", out: "PNG · MP4", fmt: "4:5 · 9:16 · 1:1 · A4" },
  { dossier: "gradient-body", nom: "Gradient body", kind: "Camera", desc: "Your silhouette leaves a grainy aura, tagged in Signal green.", out: "Live view", fmt: "Full screen" },
  { dossier: "mockup", nom: "Mockup", kind: "Mockup", desc: "Your image or screen recording in a phone held in silhouette.", out: "PNG · MP4", fmt: "4:5 · 9:16 · 1:1 · A4" },
  { dossier: "card-ring", nom: "Card ring", kind: "Poster", desc: "A full-width title and a ring of brand images, turned by your hand.", out: "PNG · MP4", fmt: "4:5 · 9:16 · 1:1 · A4" },
  { dossier: "brand-assets", nom: "Brand assets", kind: "Library", desc: "Every file of the identity, sorted as in the ASSETS folder.", out: "Original files", fmt: "PNG · JPG · MP4 · TTF" },
];
const pad2 = (n) => String(n).padStart(2, "0");
const $ = (id) => document.getElementById(id);

// ── le sceau : cercle, triangle inscrit, trois axes fléchés, trois points de relais ──
// six points dans le sens des aiguilles d'une montre depuis le haut : sommets (haut, bas droite, bas gauche)
// et points de relais opposés (haut droite, bas, haut gauche)
const NS = "http://www.w3.org/2000/svg";
const R = 168, TIP = 34;
const ANG = [-90, -30, 30, 90, 150, 210];
const IS_VERTEX = [true, false, true, false, true, false];
const P = (deg, r = R) => [Math.cos(deg * Math.PI / 180) * r, Math.sin(deg * Math.PI / 180) * r];
const svg = $("seal");
const el = (tag, attrs, parent = svg) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  parent.append(n);
  return n;
};
const geo = el("g", { "aria-hidden": "true" });
el("circle", { cx: 0, cy: 0, r: R, class: "geo" }, geo);
const V = [ANG[0], ANG[2], ANG[4]].map((a) => P(a));
el("polygon", { points: V.map((p) => p.join(",")).join(" "), class: "geo" }, geo);
const arrow = (x, y, a, s = 9) => {
  const r = a * Math.PI / 180, b1 = r + 2.7, b2 = r - 2.7;
  el("polygon", { class: "geo-fill", points: [[x, y], [x + Math.cos(b1) * s, y + Math.sin(b1) * s], [x + Math.cos(b2) * s, y + Math.sin(b2) * s]].map((p) => p.join(",")).join(" ") }, geo);
};
for (const a of [ANG[0], ANG[2], ANG[4]]) {
  const [ox, oy] = P(a + 180), [tx, ty] = P(a, R + TIP);
  el("line", { x1: ox, y1: oy, x2: tx, y2: ty, class: "geo" }, geo);
  arrow(tx, ty, a, 11);
  arrow(...P(a, R * 0.5), a, 8);
}
for (let i = 0; i < 3; i++) {   // sur chaque côté, l'aller et le retour
  const [ax, ay] = V[i], [bx, by] = V[(i + 1) % 3];
  const dir = Math.atan2(by - ay, bx - ax) * 180 / Math.PI;
  arrow(ax + (bx - ax) * 0.38, ay + (by - ay) * 0.38, dir + 180, 8);
  arrow(ax + (bx - ax) * 0.62, ay + (by - ay) * 0.62, dir, 8);
}
for (const a of [ANG[1], ANG[3], ANG[5]]) el("circle", { cx: P(a)[0], cy: P(a)[1], r: 5.5, class: "geo-fill" }, geo);

// la ligne de visée Signal, du point choisi au centre
const laser = el("line", { class: "laser", x1: 0, y1: 0, x2: 0, y2: 0, pathLength: 1 });
el("circle", { cx: 0, cy: 0, r: 5, class: "center" });

const nodes = TOOLS.map((t, i) => {
  const a = ANG[i];
  const g = el("a", { class: "node", href: `${t.dossier}/`, "aria-label": `${pad2(i + 1)} ${t.nom}` });
  const [x, y] = P(a);
  el("circle", { class: "hit", cx: x, cy: y, r: 34 }, g);
  el("rect", { class: "pin", x: x - 7, y: y - 7, width: 14, height: 14 }, g);
  let [lx, ly] = P(a, IS_VERTEX[i] ? R + TIP + 30 : R + 30);
  const cos = Math.cos(a * Math.PI / 180);
  const anchor = Math.abs(cos) < 0.2 ? "middle" : cos > 0 ? "start" : "end";
  if (a === -90) ly -= 24;
  if (a === 90) ly += 30;
  const words = t.nom.split(" ");
  el("text", { class: "no", x: lx, y: ly - (words.length > 1 ? 26 : 22), "text-anchor": anchor }, g).textContent = pad2(i + 1);
  words.forEach((w, k) => { el("text", { class: "nm", x: lx, y: ly + k * 22, "text-anchor": anchor }, g).textContent = w; });
  g.addEventListener("pointerenter", () => select(i));
  g.addEventListener("focus", () => select(i));
  return g;
});

// ── la liste : survoler une ligne vise aussi le point du sceau ──
const rows = TOOLS.map((t, i) => {
  const li = document.createElement("li");
  li.innerHTML = `<a><span class="n"></span><span class="name"></span><span class="out label"></span><img class="thumb" alt="" loading="lazy" /><span class="go mono">→</span></a>`;
  const a = li.firstChild;
  a.href = `${t.dossier}/`;
  a.querySelector(".n").textContent = pad2(i + 1);
  a.querySelector(".name").textContent = t.nom;
  a.querySelector(".out").textContent = t.out;
  a.querySelector(".thumb").src = `apercu/${t.dossier}.jpg`;
  a.addEventListener("pointerenter", () => select(i));
  $("list").append(li);
  return a;
});

// ── la fiche ──
let current = -1;
function select(i) {
  if (i === current) return;
  current = i;
  const t = TOOLS[i];
  nodes.forEach((n, k) => n.classList.toggle("on", k === i));
  rows.forEach((r, k) => r.classList.toggle("on", k === i));
  const [x, y] = P(ANG[i]);
  laser.setAttribute("x1", x); laser.setAttribute("y1", y);
  laser.classList.remove("draw"); void laser.getBBox(); laser.classList.add("draw");
  $("fKind").textContent = t.kind;
  $("fNum").textContent = `${pad2(i + 1)} / ${pad2(TOOLS.length)}`;
  $("fName").textContent = t.nom;
  $("fDesc").textContent = t.desc;
  $("fImg").src = `apercu/${t.dossier}.jpg`;
  $("fImg").alt = `${t.nom}, example output`;
  $("fSpec").replaceChildren(...[["Output", t.out], ["Format", t.fmt]].map(([k, v]) => {
    const d = document.createElement("div");
    d.innerHTML = "<dt></dt><dd></dd>";
    d.firstChild.textContent = k;
    d.lastChild.textContent = v;
    return d;
  }));
  $("fGo").href = `${t.dossier}/`;
  const f = $("fiche");
  f.classList.remove("swap"); void f.offsetWidth; f.classList.add("swap");
}
select(0);

// clavier : flèches gauche / droite d'un point à l'autre du sceau
svg.addEventListener("keydown", (e) => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  e.preventDefault();
  nodes[(current + (e.key === "ArrowRight" ? 1 : -1) + TOOLS.length) % TOOLS.length].focus();
});
</script>
</body>
</html>
